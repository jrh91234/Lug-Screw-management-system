<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('pages/Layout'); ?>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-dark">
    <div class="container-fluid">
      <span class="navbar-brand">
        <i class="bi bi-graph-up me-2"></i>Dashboard
      </span>
      <div class="d-flex align-items-center">
        <button class="btn btn-outline-light btn-sm me-2" onclick="exportCSV()">
          <i class="bi bi-download"></i>
        </button>
        <button class="btn btn-outline-light btn-sm" onclick="doLogout()">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container mt-3">
    <!-- Date Range Selector -->
    <div class="card p-2 mb-3">
      <div class="d-flex gap-1 flex-wrap">
        <button class="btn btn-sm btn-primary date-btn active" onclick="setRange('today')">วันนี้</button>
        <button class="btn btn-sm btn-outline-primary date-btn" onclick="setRange('week')">สัปดาห์</button>
        <button class="btn btn-sm btn-outline-primary date-btn" onclick="setRange('month')">เดือน</button>
        <input type="date" class="form-control form-control-sm" id="dateFrom" style="width:auto;min-height:36px;">
        <input type="date" class="form-control form-control-sm" id="dateTo" style="width:auto;min-height:36px;">
        <button class="btn btn-sm btn-outline-secondary" onclick="setCustomRange()">
          <i class="bi bi-search"></i>
        </button>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="row g-2 mb-3">
      <div class="col-3">
        <div class="card kpi-card">
          <div class="kpi-value text-primary" id="kpiOutput">-</div>
          <div class="kpi-label">ยอดผลิต</div>
        </div>
      </div>
      <div class="col-3">
        <div class="card kpi-card">
          <div class="kpi-value text-success" id="kpiAchieve">-</div>
          <div class="kpi-label">% เป้า</div>
        </div>
      </div>
      <div class="col-3">
        <div class="card kpi-card">
          <div class="kpi-value text-danger" id="kpiDefect">-</div>
          <div class="kpi-label">% NG</div>
        </div>
      </div>
      <div class="col-3">
        <div class="card kpi-card">
          <div class="kpi-value text-warning" id="kpiTickets">-</div>
          <div class="kpi-label">แจ้งซ่อม</div>
        </div>
      </div>
    </div>

    <!-- Charts Row -->
    <div class="card p-3 mb-3">
      <h6 style="font-weight:700;">ยอดผลิตแยกเครื่องจักร</h6>
      <canvas id="machineChart" height="200"></canvas>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-6">
        <div class="card p-3">
          <h6 style="font-weight:700;font-size:14px;">สัดส่วนผลิตภัณฑ์</h6>
          <canvas id="productChart" height="180"></canvas>
        </div>
      </div>
      <div class="col-6">
        <div class="card p-3">
          <h6 style="font-weight:700;font-size:14px;">กะการทำงาน</h6>
          <canvas id="shiftChart" height="180"></canvas>
        </div>
      </div>
    </div>

    <div class="card p-3 mb-3">
      <h6 style="font-weight:700;">แนวโน้มการผลิต</h6>
      <canvas id="trendChart" height="180"></canvas>
    </div>

    <!-- Production Data Table -->
    <div class="card p-3 mb-3">
      <h6 style="font-weight:700;">
        <i class="bi bi-table me-1"></i> ข้อมูลการผลิต
        <span class="badge bg-secondary ms-1" id="tableCount">0</span>
      </h6>
      <div class="table-responsive">
        <table class="table table-sm" style="font-size:13px;" id="productionTable">
          <thead>
            <tr>
              <th class="sortable" onclick="sortTable('Timestamp')">เวลา <span class="sort-arrow"></span></th>
              <th class="sortable" onclick="sortTable('MachineID')">เครื่อง <span class="sort-arrow"></span></th>
              <th class="sortable" onclick="sortTable('ProductCode')">สินค้า <span class="sort-arrow"></span></th>
              <th class="sortable" onclick="sortTable('ActualQty')">ผลิต <span class="sort-arrow"></span></th>
              <th class="sortable" onclick="sortTable('DefectQty')">NG <span class="sort-arrow"></span></th>
              <th>ผู้บันทึก</th>
            </tr>
          </thead>
          <tbody id="tableBody">
          </tbody>
        </table>
      </div>
    </div>

    <!-- Maintenance Summary -->
    <div class="card p-3 mb-3">
      <h6 style="font-weight:700;"><i class="bi bi-wrench me-1"></i> สรุปการซ่อมบำรุง</h6>
      <div class="row g-2" id="maintSummary">
        <p class="text-muted text-center">กำลังโหลด...</p>
      </div>
    </div>
  </div>

  <script>
    var currentRange = 'today';
    var dashboardData = null;
    var productionData = [];
    var currentSort = { field: 'Timestamp', order: 'desc' };
    var machineChart, productChart, shiftChart, trendChart;

    (function() {
      if (!checkAuth()) return;
      var user = getUserInfo();
      if (!user || (user.role !== 'supervisor' && user.role !== 'admin')) {
        showToast('ไม่มีสิทธิ์เข้าถึง Dashboard', 'error');
        setTimeout(function() { navigateTo('ProductionEntry'); }, 1500);
        return;
      }
      loadDashboard('today');
      renderBottomNav('Dashboard');
    })();

    function setRange(range) {
      currentRange = range;
      document.querySelectorAll('.date-btn').forEach(function(btn) {
        btn.classList.remove('btn-primary', 'active');
        btn.classList.add('btn-outline-primary');
      });
      event.currentTarget.classList.remove('btn-outline-primary');
      event.currentTarget.classList.add('btn-primary', 'active');
      loadDashboard(range);
    }

    function setCustomRange() {
      var from = document.getElementById('dateFrom').value;
      var to = document.getElementById('dateTo').value;
      if (!from || !to) {
        showToast('กรุณาเลือกวันที่', 'warning');
        return;
      }
      loadDashboard({ from: from, to: to });
    }

    function loadDashboard(dateRange) {
      showLoading();
      google.script.run
        .withSuccessHandler(function(data) {
          hideLoading();
          if (!data || !data.success) {
            showToast(data ? data.message : 'โหลดข้อมูลล้มเหลว', 'error');
            return;
          }
          dashboardData = data;
          renderKPIs(data.kpi);
          renderMachineChart(data.byMachine);
          renderProductChart(data.byProduct);
          renderShiftChart(data.byShift);
          renderTrendChart(data.dailyTrend);
          renderMaintenanceSummary(data.maintenance);
          loadProductionTable(data.dateRange);
        })
        .withFailureHandler(function(err) {
          hideLoading();
          showToast('โหลดข้อมูลล้มเหลว: ' + err.message, 'error');
        })
        .getDashboardData(getToken(), dateRange);
    }

    function renderKPIs(kpi) {
      document.getElementById('kpiOutput').textContent = (kpi.totalOutput || 0).toLocaleString();
      document.getElementById('kpiAchieve').textContent = (kpi.achievementRate || 0) + '%';
      document.getElementById('kpiDefect').textContent = (kpi.defectRate || 0) + '%';
      document.getElementById('kpiTickets').textContent = kpi.openTickets || 0;
    }

    function renderMachineChart(byMachine) {
      var labels = Object.keys(byMachine).sort();
      var planned = labels.map(function(k) { return byMachine[k].planned; });
      var actual = labels.map(function(k) { return byMachine[k].actual; });

      if (machineChart) machineChart.destroy();
      machineChart = new Chart(document.getElementById('machineChart'), {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            { label: 'แผน', data: planned, backgroundColor: 'rgba(26,115,232,0.3)', borderColor: '#1a73e8', borderWidth: 1 },
            { label: 'ผลิตจริง', data: actual, backgroundColor: 'rgba(52,168,83,0.7)', borderColor: '#34a853', borderWidth: 1 }
          ]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    function renderProductChart(byProduct) {
      var labels = Object.keys(byProduct);
      var data = labels.map(function(k) { return byProduct[k].actual; });
      var colors = ['#1a73e8', '#ea4335', '#34a853', '#fbbc04'];

      if (productChart) productChart.destroy();
      productChart = new Chart(document.getElementById('productChart'), {
        type: 'doughnut',
        data: {
          labels: labels.map(function(l) { return l.length > 15 ? l.substring(0, 15) + '...' : l; }),
          datasets: [{ data: data, backgroundColor: colors }]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } }
        }
      });
    }

    function renderShiftChart(byShift) {
      if (shiftChart) shiftChart.destroy();
      shiftChart = new Chart(document.getElementById('shiftChart'), {
        type: 'doughnut',
        data: {
          labels: ['กะกลางวัน', 'กะกลางคืน'],
          datasets: [{
            data: [byShift.Day.actual, byShift.Night.actual],
            backgroundColor: ['#fbbc04', '#1a237e']
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } }
        }
      });
    }

    function renderTrendChart(dailyTrend) {
      var dates = Object.keys(dailyTrend).sort();
      var actual = dates.map(function(d) { return dailyTrend[d].actual; });
      var planned = dates.map(function(d) { return dailyTrend[d].planned; });

      if (trendChart) trendChart.destroy();
      trendChart = new Chart(document.getElementById('trendChart'), {
        type: 'line',
        data: {
          labels: dates,
          datasets: [
            { label: 'ผลิตจริง', data: actual, borderColor: '#34a853', backgroundColor: 'rgba(52,168,83,0.1)', fill: true, tension: 0.3 },
            { label: 'แผน', data: planned, borderColor: '#1a73e8', borderDash: [5, 5], fill: false, tension: 0.3 }
          ]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    function renderMaintenanceSummary(maint) {
      var html = '<div class="col-4 text-center"><div class="card p-2 kpi-card">' +
        '<div class="kpi-value" style="font-size:1.3rem;">' + maint.totalTickets + '</div>' +
        '<div class="kpi-label">ทั้งหมด</div></div></div>' +
        '<div class="col-4 text-center"><div class="card p-2 kpi-card">' +
        '<div class="kpi-value text-success" style="font-size:1.3rem;">' + maint.resolvedTickets + '</div>' +
        '<div class="kpi-label">แก้ไขแล้ว</div></div></div>' +
        '<div class="col-4 text-center"><div class="card p-2 kpi-card">' +
        '<div class="kpi-value text-danger" style="font-size:1.3rem;">' + maint.totalDowntime + '</div>' +
        '<div class="kpi-label">หยุด (นาที)</div></div></div>';
      document.getElementById('maintSummary').innerHTML = html;
    }

    function loadProductionTable(dateRange) {
      google.script.run
        .withSuccessHandler(function(logs) {
          productionData = logs;
          renderTable(logs);
        })
        .getSortedProductionData(getToken(), currentSort.field, currentSort.order,
          { dateFrom: dateRange.from, dateTo: dateRange.to });
    }

    function renderTable(logs) {
      document.getElementById('tableCount').textContent = logs.length;
      var html = '';
      logs.forEach(function(log) {
        if (log.Status === 'cancelled') return;
        var time = log.Timestamp ? log.Timestamp.split(' ')[1] || '' : '';
        html += '<tr>' +
          '<td>' + time + '</td>' +
          '<td>' + (log.MachineID || '') + '</td>' +
          '<td style="max-width:100px;overflow:hidden;text-overflow:ellipsis;">' + (log.ProductCode || '') + '</td>' +
          '<td><strong>' + (log.ActualQty || 0) + '</strong></td>' +
          '<td>' + (log.DefectQty > 0 ? '<span class="text-danger">' + log.DefectQty + '</span>' : '0') + '</td>' +
          '<td>' + (log.EmployeeName || '') + '</td>' +
          '</tr>';
      });
      document.getElementById('tableBody').innerHTML = html || '<tr><td colspan="6" class="text-center text-muted">ไม่มีข้อมูล</td></tr>';
    }

    function sortTable(field) {
      if (currentSort.field === field) {
        currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
      } else {
        currentSort.field = field;
        currentSort.order = 'asc';
      }

      // Client-side sort
      productionData.sort(function(a, b) {
        var valA = a[field], valB = b[field];
        if (!isNaN(Number(valA)) && !isNaN(Number(valB))) {
          valA = Number(valA); valB = Number(valB);
        }
        if (currentSort.order === 'desc') return valA > valB ? -1 : valA < valB ? 1 : 0;
        return valA > valB ? 1 : valA < valB ? -1 : 0;
      });
      renderTable(productionData);
    }

    function exportCSV() {
      if (!dashboardData) { showToast('ไม่มีข้อมูล', 'warning'); return; }
      showLoading();
      google.script.run
        .withSuccessHandler(function(result) {
          hideLoading();
          if (result.success) {
            var blob = new Blob(['\ufeff' + result.csv], { type: 'text/csv;charset=utf-8;' });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = result.filename;
            link.click();
            showToast('ดาวน์โหลดสำเร็จ', 'success');
          } else {
            showToast(result.message, 'error');
          }
        })
        .exportProductionCSV(getToken(), dashboardData.dateRange.from, dashboardData.dateRange.to);
    }
  </script>
</body>
</html>
