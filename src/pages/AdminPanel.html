<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('pages/Layout'); ?>
</head>
<body>
  <nav class="navbar navbar-dark">
    <div class="container-fluid">
      <span class="navbar-brand">
        <i class="bi bi-person-gear me-2"></i>จัดการระบบ
      </span>
      <button class="btn btn-outline-light btn-sm" onclick="doLogout()">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </nav>

  <div class="container mt-3">
    <!-- Tabs -->
    <ul class="nav nav-pills mb-3" role="tablist" style="font-size:14px;">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#usersTab">
          <i class="bi bi-people me-1"></i>พนักงาน
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#machinesTab">
          <i class="bi bi-gear me-1"></i>เครื่องจักร
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#productsTab">
          <i class="bi bi-box me-1"></i>สินค้า
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- Users Tab -->
      <div class="tab-pane fade show active" id="usersTab">
        <div class="card p-3 mb-3">
          <h6 style="font-weight:700;">เพิ่มพนักงานใหม่</h6>
          <div class="row g-2">
            <div class="col-6">
              <input type="text" class="form-control" id="newEmpId" placeholder="รหัสพนักงาน">
            </div>
            <div class="col-6">
              <input type="text" class="form-control" id="newEmpName" placeholder="ชื่อ-นามสกุล">
            </div>
            <div class="col-4">
              <input type="password" class="form-control" id="newEmpPin" placeholder="PIN 4 หลัก" maxlength="4">
            </div>
            <div class="col-4">
              <select class="form-select" id="newEmpRole">
                <option value="operator">Operator</option>
                <option value="maintenance">Maintenance</option>
                <option value="supervisor">Supervisor</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div class="col-4">
              <button class="btn btn-primary w-100" onclick="addNewUser()">
                <i class="bi bi-plus-lg"></i> เพิ่ม
              </button>
            </div>
          </div>
        </div>

        <div class="card p-3">
          <h6 style="font-weight:700;">รายชื่อพนักงาน</h6>
          <div class="table-responsive">
            <table class="table table-sm" style="font-size:13px;">
              <thead>
                <tr>
                  <th>รหัส</th>
                  <th>ชื่อ</th>
                  <th>บทบาท</th>
                  <th>สถานะ</th>
                  <th>จัดการ</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Machines Tab -->
      <div class="tab-pane fade" id="machinesTab">
        <div class="card p-3">
          <h6 style="font-weight:700;">เครื่องจักร H1 Lug&Screw Line</h6>
          <div id="machinesList">
            <p class="text-muted text-center">กำลังโหลด...</p>
          </div>
        </div>
      </div>

      <!-- Products Tab -->
      <div class="tab-pane fade" id="productsTab">
        <div class="card p-3">
          <h6 style="font-weight:700;">ผลิตภัณฑ์และ BOM</h6>
          <div id="productsList">
            <p class="text-muted text-center">กำลังโหลด...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      if (!checkAuth()) return;
      var user = getUserInfo();
      if (!user || user.role !== 'admin') {
        showToast('ไม่มีสิทธิ์เข้าถึงหน้านี้', 'error');
        setTimeout(function() { navigateTo('ProductionEntry'); }, 1500);
        return;
      }
      loadUsers();
      loadMachinesAdmin();
      loadProductsAdmin();
      renderBottomNav('AdminPanel');
    })();

    // === Users Management ===
    function loadUsers() {
      google.script.run
        .withSuccessHandler(function(users) {
          if (!Array.isArray(users)) {
            showToast('ไม่สามารถโหลดข้อมูลพนักงาน', 'error');
            return;
          }
          var html = '';
          users.forEach(function(u) {
            var active = String(u.active) === 'true' || u.active === true;
            var roleLabels = { operator: 'ช่างผลิต', maintenance: 'ช่างซ่อม', supervisor: 'หัวหน้า', admin: 'ผู้ดูแล' };
            html += '<tr>' +
              '<td>' + u.employeeId + '</td>' +
              '<td>' + u.name + '</td>' +
              '<td><span class="badge bg-secondary">' + (roleLabels[u.role] || u.role) + '</span></td>' +
              '<td>' + (active ? '<span class="text-success">ใช้งาน</span>' : '<span class="text-danger">ระงับ</span>') + '</td>' +
              '<td><button class="btn btn-sm btn-outline-' + (active ? 'danger' : 'success') + '" ' +
              'onclick="toggleUser(\'' + u.employeeId + '\', ' + active + ')">' +
              (active ? 'ระงับ' : 'เปิดใช้') + '</button></td>' +
              '</tr>';
          });
          document.getElementById('usersTableBody').innerHTML = html || '<tr><td colspan="5" class="text-center">ไม่มีข้อมูล</td></tr>';
        })
        .getAllUsers(getToken());
    }

    function addNewUser() {
      var empId = document.getElementById('newEmpId').value.trim().toUpperCase();
      var name = document.getElementById('newEmpName').value.trim();
      var pin = document.getElementById('newEmpPin').value.trim();
      var role = document.getElementById('newEmpRole').value;

      if (!empId || !name || !pin) {
        showToast('กรุณากรอกข้อมูลให้ครบ', 'warning');
        return;
      }
      if (pin.length !== 4 || isNaN(pin)) {
        showToast('PIN ต้องเป็นตัวเลข 4 หลัก', 'warning');
        return;
      }

      showLoading();
      google.script.run
        .withSuccessHandler(function(result) {
          hideLoading();
          if (result.success) {
            showToast('เพิ่มพนักงานเรียบร้อย', 'success');
            document.getElementById('newEmpId').value = '';
            document.getElementById('newEmpName').value = '';
            document.getElementById('newEmpPin').value = '';
            loadUsers();
          } else {
            showToast(result.message, 'error');
          }
        })
        .addUser(getToken(), { employeeId: empId, name: name, pin: pin, role: role });
    }

    function toggleUser(empId, isActive) {
      showLoading();
      google.script.run
        .withSuccessHandler(function(result) {
          hideLoading();
          if (result.success) {
            showToast('อัพเดทสำเร็จ', 'success');
            loadUsers();
          } else {
            showToast('อัพเดทล้มเหลว', 'error');
          }
        })
        .updateUser(getToken(), empId, { Active: !isActive });
    }

    // === Machines Management ===
    function loadMachinesAdmin() {
      google.script.run
        .withSuccessHandler(function(machines) {
          var html = '';
          machines.forEach(function(m) {
            var statusColor = m.status === 'running' ? 'success' : m.status === 'maintenance' ? 'warning' : 'danger';
            html += '<div class="card p-3 mb-2" style="border-left:4px solid var(--' + statusColor + '-color);">' +
              '<div class="d-flex justify-content-between align-items-center">' +
              '<div><strong>' + m.machineName + '</strong> <small class="text-muted">(' + m.machineId + ')</small></div>' +
              '<span class="status-badge status-' + m.status + '">' + m.status + '</span>' +
              '</div>' +
              '<div class="mt-2" style="font-size:13px;">สินค้า: ' +
              (m.assignedProducts ? m.assignedProducts.join(', ') : 'ยังไม่กำหนด') + '</div>' +
              '<div class="mt-2 d-flex gap-1">' +
              '<button class="btn btn-sm btn-outline-success" onclick="setMachineStatus(\'' + m.machineId + '\', \'running\')">ทำงาน</button>' +
              '<button class="btn btn-sm btn-outline-warning" onclick="setMachineStatus(\'' + m.machineId + '\', \'maintenance\')">ซ่อม</button>' +
              '<button class="btn btn-sm btn-outline-danger" onclick="setMachineStatus(\'' + m.machineId + '\', \'down\')">หยุด</button>' +
              '</div></div>';
          });
          document.getElementById('machinesList').innerHTML = html;
        })
        .getMachines();
    }

    function setMachineStatus(machineId, status) {
      google.script.run
        .withSuccessHandler(function() {
          showToast('อัพเดทสถานะเรียบร้อย', 'success');
          loadMachinesAdmin();
        })
        .updateMachineStatus(machineId, status);
    }

    // === Products Management ===
    function loadProductsAdmin() {
      google.script.run
        .withSuccessHandler(function(products) {
          var html = '';
          products.forEach(function(p) {
            html += '<div class="card p-3 mb-2">' +
              '<h6 style="font-weight:700;font-size:14px;">' + p.productCode + '</h6>' +
              '<p style="font-size:13px;margin-bottom:4px;">' + p.productName + '</p>' +
              '<small class="text-muted">Default: ' + (p.defaultQty || 1300) + ' pcs</small>';

            if (p.bom && p.bom.length > 0) {
              html += '<div class="mt-2" style="font-size:12px;">' +
                '<strong>BOM:</strong><ul class="mb-0 ps-3">';
              p.bom.forEach(function(c) {
                html += '<li>' + c.componentCode + ' - ' + c.componentName +
                  ' (x' + c.qtyPerUnit + ') <span class="text-muted">' + c.supplier + '</span></li>';
              });
              html += '</ul></div>';
            }
            html += '</div>';
          });
          document.getElementById('productsList').innerHTML = html || '<p class="text-muted">ไม่มีผลิตภัณฑ์</p>';
        })
        .getAllProductsWithBOM();
    }
  </script>
</body>
</html>
