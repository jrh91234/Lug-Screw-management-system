<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('pages/Layout'); ?>
</head>
<body>
  <!-- Top Navbar -->
  <nav class="navbar navbar-dark">
    <div class="container-fluid">
      <span class="navbar-brand">
        <i class="bi bi-clipboard-data me-2"></i>กรอกยอดผลิต
      </span>
      <div class="d-flex align-items-center">
        <span class="text-white me-3" id="userNameDisplay" style="font-size:14px;"></span>
        <button class="btn btn-outline-light btn-sm" onclick="doLogout()">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container mt-3">
    <!-- Shift indicator -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="badge bg-info" id="shiftBadge" style="font-size:14px;"></span>
      <span class="text-muted" id="dateDisplay" style="font-size:14px;"></span>
    </div>

    <!-- Machine Selection -->
    <div class="card p-3 mb-3">
      <h6 class="mb-2" style="font-weight:700;"><i class="bi bi-gear me-1"></i> เลือกเครื่องจักร</h6>
      <div class="row g-2" id="machineGrid">
        <!-- Machine buttons dynamically rendered -->
      </div>
    </div>

    <!-- Product Selection -->
    <div class="card p-3 mb-3" id="productSection" style="display:none;">
      <h6 class="mb-2" style="font-weight:700;"><i class="bi bi-box me-1"></i> เลือกผลิตภัณฑ์</h6>
      <div id="productList">
        <!-- Product radio buttons dynamically rendered -->
      </div>
    </div>

    <!-- Quantity Input -->
    <div class="card p-3 mb-3" id="qtySection" style="display:none;">
      <h6 class="mb-2" style="font-weight:700;"><i class="bi bi-123 me-1"></i> จำนวน</h6>
      <div class="row g-2">
        <div class="col-4">
          <label class="form-label" style="font-size:13px;">แผน (pcs)</label>
          <input type="number" class="form-control text-center" id="plannedQty" value="1300"
                 inputmode="numeric">
        </div>
        <div class="col-4">
          <label class="form-label" style="font-size:13px;">ผลิตได้ (pcs)</label>
          <input type="number" class="form-control text-center" id="actualQty" placeholder="0"
                 inputmode="numeric" style="font-weight:700;font-size:18px;border-color:#1a73e8;">
        </div>
        <div class="col-4">
          <label class="form-label" style="font-size:13px;">NG (pcs)</label>
          <input type="number" class="form-control text-center" id="defectQty" value="0"
                 inputmode="numeric">
        </div>
      </div>
      <div class="mt-2">
        <label class="form-label" style="font-size:13px;">หมายเหตุ</label>
        <input type="text" class="form-control" id="remark" placeholder="ระบุหมายเหตุ (ถ้ามี)">
      </div>
    </div>

    <!-- Submit Button -->
    <button class="btn btn-success w-100 mb-3" id="submitBtn" onclick="submitEntry()" style="display:none;height:56px;font-size:18px;">
      <i class="bi bi-check-circle me-2"></i>บันทึกยอดผลิต
    </button>

    <!-- Today's Entries -->
    <div class="card p-3">
      <h6 class="mb-2" style="font-weight:700;">
        <i class="bi bi-clock-history me-1"></i> รายการวันนี้
        <span class="badge bg-secondary ms-1" id="entryCount">0</span>
      </h6>
      <div id="todayEntries">
        <p class="text-muted text-center" style="font-size:14px;">ยังไม่มีรายการ</p>
      </div>
    </div>
  </div>

  <script>
    var selectedMachine = null;
    var selectedProduct = null;
    var machinesData = [];

    // Initialize page
    (function() {
      if (!checkAuth()) return;
      var user = getUserInfo();
      if (user) {
        document.getElementById('userNameDisplay').textContent = user.name;
      }

      // Set date and shift
      var now = new Date();
      var hour = now.getHours();
      var shift = (hour >= 8 && hour < 20) ? 'Day Shift (กะกลางวัน)' : 'Night Shift (กะกลางคืน)';
      document.getElementById('shiftBadge').textContent = shift;
      document.getElementById('dateDisplay').textContent = now.toLocaleDateString('th-TH', {
        year: 'numeric', month: 'short', day: 'numeric'
      });

      loadMachines();
      loadTodayEntries();
      renderBottomNav('ProductionEntry');
    })();

    function loadMachines() {
      google.script.run
        .withSuccessHandler(function(machines) {
          machinesData = machines;
          renderMachineGrid(machines);
        })
        .withFailureHandler(function(err) {
          showToast('โหลดข้อมูลเครื่องจักรล้มเหลว', 'error');
        })
        .getMachines();
    }

    function renderMachineGrid(machines) {
      var html = '';
      machines.forEach(function(m) {
        var statusClass = 'status-' + m.status;
        var disabled = m.status === 'down' ? 'disabled' : '';
        var statusLabel = m.status === 'running' ? '' : (m.status === 'maintenance' ? ' (ซ่อม)' : ' (หยุด)');
        html += '<div class="col-6 col-md-3">' +
          '<button class="btn btn-outline-secondary machine-btn w-100 ' + statusClass + '" ' +
          'id="machine-' + m.machineId + '" ' + disabled + ' ' +
          'onclick="selectMachine(\'' + m.machineId + '\')">' +
          '<div>' + m.machineName + '</div>' +
          '<small class="text-muted">' + m.machineId + statusLabel + '</small>' +
          '</button></div>';
      });
      document.getElementById('machineGrid').innerHTML = html;
    }

    function selectMachine(machineId) {
      // Remove active from all
      document.querySelectorAll('.machine-btn').forEach(function(btn) {
        btn.classList.remove('active');
      });

      // Add active to selected
      document.getElementById('machine-' + machineId).classList.add('active');
      selectedMachine = machineId;

      // Load products for this machine
      showLoading();
      google.script.run
        .withSuccessHandler(function(products) {
          hideLoading();
          renderProducts(products);
        })
        .withFailureHandler(function(err) {
          hideLoading();
          showToast('โหลดผลิตภัณฑ์ล้มเหลว', 'error');
        })
        .getMachineProducts(machineId);
    }

    function renderProducts(products) {
      var section = document.getElementById('productSection');
      var html = '';

      if (products.length === 0) {
        html = '<p class="text-muted">ไม่มีผลิตภัณฑ์ที่กำหนดให้เครื่องจักรนี้</p>';
        section.style.display = 'block';
        return;
      }

      products.forEach(function(p, i) {
        var checked = i === 0 ? 'checked' : '';
        html += '<div class="form-check mb-2 p-2 rounded" style="background:#f8f9fa;">' +
          '<input class="form-check-input" type="radio" name="product" ' +
          'id="prod-' + i + '" value="' + p.productCode + '" ' + checked + ' ' +
          'onchange="selectProduct(\'' + p.productCode + '\', ' + p.defaultQty + ')" ' +
          'style="width:20px;height:20px;margin-top:6px;">' +
          '<label class="form-check-label ms-2" for="prod-' + i + '" style="cursor:pointer;">' +
          '<strong>' + p.productCode + '</strong><br>' +
          '<small class="text-muted">' + p.productName + '</small>' +
          '</label></div>';
      });

      document.getElementById('productList').innerHTML = html;
      section.style.display = 'block';

      // Auto-select first product
      if (products.length > 0) {
        selectProduct(products[0].productCode, products[0].defaultQty);
      }
    }

    function selectProduct(productCode, defaultQty) {
      selectedProduct = productCode;
      document.getElementById('plannedQty').value = defaultQty || 1300;
      document.getElementById('qtySection').style.display = 'block';
      document.getElementById('submitBtn').style.display = 'block';
      document.getElementById('actualQty').focus();
    }

    function submitEntry() {
      var actualQty = document.getElementById('actualQty').value;

      if (!selectedMachine) {
        showToast('กรุณาเลือกเครื่องจักร', 'warning');
        return;
      }
      if (!selectedProduct) {
        showToast('กรุณาเลือกผลิตภัณฑ์', 'warning');
        return;
      }
      if (!actualQty || Number(actualQty) < 0) {
        showToast('กรุณากรอกจำนวนที่ผลิตได้', 'warning');
        return;
      }

      var data = {
        machineId: selectedMachine,
        productCode: selectedProduct,
        plannedQty: Number(document.getElementById('plannedQty').value) || 1300,
        actualQty: Number(actualQty),
        defectQty: Number(document.getElementById('defectQty').value) || 0,
        remark: document.getElementById('remark').value.trim()
      };

      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังบันทึก...';

      google.script.run
        .withSuccessHandler(function(result) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>บันทึกยอดผลิต';

          if (result.success) {
            showToast(result.message, 'success');
            // Reset quantity fields
            document.getElementById('actualQty').value = '';
            document.getElementById('defectQty').value = '0';
            document.getElementById('remark').value = '';
            loadTodayEntries();
          } else {
            showToast(result.message, 'error');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>บันทึกยอดผลิต';
          showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
        })
        .submitProduction(getToken(), data);
    }

    function loadTodayEntries() {
      google.script.run
        .withSuccessHandler(function(entries) {
          renderTodayEntries(entries);
        })
        .getTodayProductionByEmployee(getToken());
    }

    function renderTodayEntries(entries) {
      document.getElementById('entryCount').textContent = entries.length;

      if (entries.length === 0) {
        document.getElementById('todayEntries').innerHTML =
          '<p class="text-muted text-center" style="font-size:14px;">ยังไม่มีรายการ</p>';
        return;
      }

      var html = '';
      entries.forEach(function(entry) {
        var cancelledClass = entry.Status === 'cancelled' ? ' cancelled' : '';
        var time = entry.Timestamp ? entry.Timestamp.split(' ')[1] || '' : '';
        html += '<div class="entry-card' + cancelledClass + '">' +
          '<div class="d-flex justify-content-between">' +
          '<strong>' + (entry.MachineID || '') + '</strong>' +
          '<small class="text-muted">' + time + '</small>' +
          '</div>' +
          '<div class="d-flex justify-content-between mt-1">' +
          '<span style="font-size:13px;">' + (entry.ProductCode || '') + '</span>' +
          '<span style="font-size:13px;">' +
          '<strong>' + (entry.ActualQty || 0) + '</strong> / ' + (entry.PlannedQty || 0) + ' pcs' +
          (entry.DefectQty > 0 ? ' <span class="text-danger">(NG: ' + entry.DefectQty + ')</span>' : '') +
          '</span></div>' +
          (entry.Status === 'cancelled' ? '<small class="text-danger">ยกเลิก</small>' : '') +
          '</div>';
      });

      document.getElementById('todayEntries').innerHTML = html;
    }
  </script>
</body>
</html>
