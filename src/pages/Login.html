<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('pages/Layout'); ?>
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
      padding: 16px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-logo i {
      font-size: 48px;
      color: #1a73e8;
    }

    .login-logo h4 {
      margin-top: 8px;
      color: #202124;
      font-weight: 700;
    }

    .login-logo p {
      color: #5f6368;
      font-size: 14px;
      margin: 0;
    }

    .pin-input {
      letter-spacing: 12px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .numpad-btn {
      height: 56px;
      font-size: 22px;
      font-weight: 600;
      border-radius: 12px;
      border: 1px solid #dadce0;
      background: #fff;
      color: #202124;
      cursor: pointer;
      transition: background 0.15s;
    }

    .numpad-btn:active {
      background: #e8f0fe;
    }

    .numpad-btn.action {
      background: #f1f3f4;
      font-size: 16px;
    }

    .numpad-btn.submit-btn {
      background: #1a73e8;
      color: #fff;
      border-color: #1a73e8;
      font-size: 16px;
    }

    .numpad-btn.submit-btn:active {
      background: #0d47a1;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <i class="bi bi-gear-wide-connected"></i>
        <h4>H1 Lug&Screw</h4>
        <p>Production Management System</p>
      </div>

      <div class="mb-3">
        <label class="form-label" style="font-weight:600;">รหัสพนักงาน</label>
        <input type="text" class="form-control" id="employeeId" placeholder="กรอกรหัสพนักงาน"
               autocomplete="off" style="text-transform:uppercase;">
      </div>

      <div class="mb-3">
        <label class="form-label" style="font-weight:600;">รหัส PIN</label>
        <input type="password" class="form-control pin-input" id="pinInput" maxlength="4"
               readonly placeholder="----">
      </div>

      <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>

      <div class="numpad">
        <button class="numpad-btn" onclick="addPin('1')">1</button>
        <button class="numpad-btn" onclick="addPin('2')">2</button>
        <button class="numpad-btn" onclick="addPin('3')">3</button>
        <button class="numpad-btn" onclick="addPin('4')">4</button>
        <button class="numpad-btn" onclick="addPin('5')">5</button>
        <button class="numpad-btn" onclick="addPin('6')">6</button>
        <button class="numpad-btn" onclick="addPin('7')">7</button>
        <button class="numpad-btn" onclick="addPin('8')">8</button>
        <button class="numpad-btn" onclick="addPin('9')">9</button>
        <button class="numpad-btn action" onclick="clearPin()"><i class="bi bi-x-lg"></i></button>
        <button class="numpad-btn" onclick="addPin('0')">0</button>
        <button class="numpad-btn action" onclick="deletePin()"><i class="bi bi-backspace"></i></button>
      </div>

      <button class="btn btn-primary w-100 mt-3" onclick="doLogin()" id="loginBtn"
              style="height:52px;font-size:18px;font-weight:600;">
        <i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ
      </button>
    </div>
  </div>

  <script>
    var pinValue = '';

    function addPin(digit) {
      if (pinValue.length < 4) {
        pinValue += digit;
        document.getElementById('pinInput').value = pinValue;
        hideError();
      }
    }

    function deletePin() {
      pinValue = pinValue.slice(0, -1);
      document.getElementById('pinInput').value = pinValue;
    }

    function clearPin() {
      pinValue = '';
      document.getElementById('pinInput').value = '';
    }

    function showError(msg) {
      var el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.remove('d-none');
    }

    function hideError() {
      document.getElementById('errorMsg').classList.add('d-none');
    }

    function doLogin() {
      var employeeId = document.getElementById('employeeId').value.trim().toUpperCase();
      var pin = pinValue;

      if (!employeeId) {
        showError('กรุณากรอกรหัสพนักงาน');
        return;
      }
      if (pin.length !== 4) {
        showError('กรุณากรอกรหัส PIN 4 หลัก');
        return;
      }

      var btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังเข้าสู่ระบบ...';

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            setToken(result.token);
            setUserInfo(result.user);
            navigateTo('ProductionEntry');
          } else {
            showError(result.message);
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ';
          }
        })
        .withFailureHandler(function(err) {
          showError('เกิดข้อผิดพลาด: ' + err.message);
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ';
        })
        .authenticateUser(employeeId, pin);
    }

    // Auto-login check
    (function() {
      var token = getToken();
      if (token) {
        google.script.run
          .withSuccessHandler(function(user) {
            if (user) {
              navigateTo('ProductionEntry');
            }
          })
          .validateSession(token);
      }
    })();
  </script>
</body>
</html>
