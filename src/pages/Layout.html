<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

<style>
  :root {
    --primary-color: #1a73e8;
    --success-color: #34a853;
    --warning-color: #fbbc04;
    --danger-color: #ea4335;
    --dark-color: #202124;
    --light-bg: #f8f9fa;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 16px;
    background-color: var(--light-bg);
    padding-bottom: 70px;
    -webkit-tap-highlight-color: transparent;
  }

  .navbar {
    background: linear-gradient(135deg, #1a73e8, #0d47a1) !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .navbar-brand {
    font-weight: 700;
    font-size: 1.1rem;
  }

  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    border-top: 1px solid #dee2e6;
    display: flex;
    justify-content: space-around;
    padding: 6px 0;
    z-index: 1050;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
  }

  .bottom-nav a {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: #5f6368;
    font-size: 11px;
    padding: 4px 8px;
    min-width: 56px;
    transition: color 0.2s;
  }

  .bottom-nav a.active, .bottom-nav a:hover {
    color: var(--primary-color);
  }

  .bottom-nav a i {
    font-size: 22px;
    margin-bottom: 2px;
  }

  .card {
    border: none;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 12px;
  }

  .btn {
    border-radius: 8px;
    font-weight: 500;
    min-height: 48px;
    font-size: 16px;
  }

  .form-control, .form-select {
    border-radius: 8px;
    min-height: 48px;
    font-size: 16px;
  }

  .machine-btn {
    min-height: 64px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 12px;
    transition: all 0.2s;
  }

  .machine-btn.active {
    transform: scale(0.96);
    box-shadow: 0 0 0 3px var(--primary-color);
  }

  .machine-btn.status-running { border-left: 4px solid var(--success-color); }
  .machine-btn.status-maintenance { border-left: 4px solid var(--warning-color); }
  .machine-btn.status-down { border-left: 4px solid var(--danger-color); }

  .kpi-card {
    text-align: center;
    padding: 16px 8px;
  }

  .kpi-card .kpi-value {
    font-size: 1.8rem;
    font-weight: 700;
    line-height: 1.2;
  }

  .kpi-card .kpi-label {
    font-size: 0.75rem;
    color: #5f6368;
    margin-top: 4px;
  }

  .status-badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  .status-running { background: #e6f4ea; color: #137333; }
  .status-maintenance { background: #fef7e0; color: #b06000; }
  .status-down { background: #fce8e6; color: #c5221f; }
  .status-open { background: #e8f0fe; color: #1967d2; }
  .status-in-progress { background: #fef7e0; color: #b06000; }
  .status-resolved { background: #e6f4ea; color: #137333; }
  .status-closed { background: #f1f3f4; color: #5f6368; }

  .priority-low { color: #1967d2; }
  .priority-medium { color: #b06000; }
  .priority-high { color: #e37400; }
  .priority-critical { color: #c5221f; }

  .toast-container {
    position: fixed;
    top: 70px;
    right: 16px;
    z-index: 9999;
  }

  .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255,255,255,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  .entry-card {
    border-left: 4px solid var(--primary-color);
    padding: 10px 14px;
    margin-bottom: 8px;
    background: #fff;
    border-radius: 0 8px 8px 0;
    font-size: 14px;
  }

  .entry-card.cancelled {
    border-left-color: var(--danger-color);
    opacity: 0.6;
  }

  @media (max-width: 576px) {
    .container { padding: 0 12px; }
    h5 { font-size: 1.1rem; }
  }

  .sortable { cursor: pointer; user-select: none; }
  .sortable:hover { background: #f1f3f4; }
  .sort-arrow { font-size: 12px; margin-left: 4px; }
</style>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Loading overlay (hidden by default) -->
<div class="loading-overlay" id="loadingOverlay" style="display:none;">
  <div class="spinner-border text-primary" role="status" style="width:3rem;height:3rem;">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<script>
// Session management
function getToken() {
  return localStorage.getItem('h1_token');
}

function setToken(token) {
  localStorage.setItem('h1_token', token);
}

function setUserInfo(user) {
  localStorage.setItem('h1_user', JSON.stringify(user));
}

function getUserInfo() {
  var str = localStorage.getItem('h1_user');
  return str ? JSON.parse(str) : null;
}

function clearSession() {
  localStorage.removeItem('h1_token');
  localStorage.removeItem('h1_user');
}

function navigateTo(page) {
  var url = '<?= ScriptApp.getService().getUrl() ?>' + '?page=' + page;
  window.top.location.href = url;
}

function checkAuth() {
  var token = getToken();
  if (!token) {
    navigateTo('Login');
    return false;
  }
  return true;
}

function doLogout() {
  var token = getToken();
  if (token) {
    google.script.run.logout(token);
  }
  clearSession();
  navigateTo('Login');
}

// Toast notifications
function showToast(message, type) {
  type = type || 'success';
  var colors = {
    success: '#34a853',
    error: '#ea4335',
    warning: '#fbbc04',
    info: '#1a73e8'
  };
  var icons = {
    success: 'bi-check-circle-fill',
    error: 'bi-x-circle-fill',
    warning: 'bi-exclamation-circle-fill',
    info: 'bi-info-circle-fill'
  };

  var toast = document.createElement('div');
  toast.className = 'toast show';
  toast.setAttribute('role', 'alert');
  toast.style.cssText = 'min-width:280px;margin-bottom:8px;border-left:4px solid ' + colors[type];
  toast.innerHTML = '<div class="toast-body d-flex align-items-center">' +
    '<i class="bi ' + icons[type] + ' me-2" style="color:' + colors[type] + ';font-size:20px;"></i>' +
    '<span>' + message + '</span>' +
    '<button type="button" class="btn-close ms-auto" onclick="this.closest(\'.toast\').remove()"></button>' +
    '</div>';

  document.getElementById('toastContainer').appendChild(toast);
  setTimeout(function() { toast.remove(); }, 4000);
}

// Loading overlay
function showLoading() {
  document.getElementById('loadingOverlay').style.display = 'flex';
}

function hideLoading() {
  document.getElementById('loadingOverlay').style.display = 'none';
}

// Render bottom navigation
function renderBottomNav(activePage) {
  var user = getUserInfo();
  var role = user ? user.role : 'operator';
  var navItems = [
    { page: 'ProductionEntry', icon: 'bi-clipboard-data', label: 'กรอกยอด' },
    { page: 'MaintenanceReport', icon: 'bi-wrench', label: 'แจ้งซ่อม' },
    { page: 'MachineStatus', icon: 'bi-gear', label: 'เครื่องจักร' }
  ];

  if (role === 'supervisor' || role === 'admin') {
    navItems.push({ page: 'Dashboard', icon: 'bi-graph-up', label: 'Dashboard' });
  }
  if (role === 'admin') {
    navItems.push({ page: 'AdminPanel', icon: 'bi-person-gear', label: 'จัดการ' });
  }

  var html = '<nav class="bottom-nav">';
  navItems.forEach(function(item) {
    var cls = activePage === item.page ? ' active' : '';
    html += '<a href="#" class="' + cls + '" onclick="navigateTo(\'' + item.page + '\');return false;">';
    html += '<i class="bi ' + item.icon + '"></i>';
    html += '<span>' + item.label + '</span></a>';
  });
  html += '</nav>';

  document.body.insertAdjacentHTML('beforeend', html);
}
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
