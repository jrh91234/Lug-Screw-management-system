<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('pages/Layout'); ?>
</head>
<body>
  <nav class="navbar navbar-dark">
    <div class="container-fluid">
      <span class="navbar-brand">
        <i class="bi bi-gear me-2"></i>สถานะเครื่องจักร
      </span>
      <div class="d-flex align-items-center">
        <button class="btn btn-outline-light btn-sm me-2" onclick="refreshData()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button class="btn btn-outline-light btn-sm" onclick="doLogout()">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container mt-3">
    <!-- Summary Row -->
    <div class="row g-2 mb-3">
      <div class="col-4">
        <div class="card kpi-card">
          <div class="kpi-value text-success" id="runningCount">-</div>
          <div class="kpi-label">ทำงาน</div>
        </div>
      </div>
      <div class="col-4">
        <div class="card kpi-card">
          <div class="kpi-value text-warning" id="maintCount">-</div>
          <div class="kpi-label">ซ่อมบำรุง</div>
        </div>
      </div>
      <div class="col-4">
        <div class="card kpi-card">
          <div class="kpi-value text-danger" id="downCount">-</div>
          <div class="kpi-label">หยุดทำงาน</div>
        </div>
      </div>
    </div>

    <h6 class="mb-2" style="font-weight:700;">
      H1 Lug&Screw Line
      <small class="text-muted ms-1">8 เครื่อง</small>
    </h6>

    <!-- Machine Grid -->
    <div class="row g-2" id="machineStatusGrid">
      <div class="text-center p-4">
        <div class="spinner-border text-primary"></div>
      </div>
    </div>
  </div>

  <!-- Machine Detail Modal -->
  <div class="modal fade" id="machineModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:16px;">
        <div class="modal-header">
          <h6 class="modal-title" id="modalMachineName" style="font-weight:700;"></h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalBody">
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      if (!checkAuth()) return;
      loadMachineStatus();
      renderBottomNav('MachineStatus');
      // Auto-refresh every 60 seconds
      setInterval(loadMachineStatus, 60000);
    })();

    function refreshData() {
      loadMachineStatus();
      showToast('รีเฟรชข้อมูลแล้ว', 'info');
    }

    function loadMachineStatus() {
      google.script.run
        .withSuccessHandler(function(machines) {
          renderMachineStatus(machines);
        })
        .getMachines();
    }

    function renderMachineStatus(machines) {
      var running = 0, maint = 0, down = 0;
      machines.forEach(function(m) {
        if (m.status === 'running') running++;
        else if (m.status === 'maintenance') maint++;
        else down++;
      });

      document.getElementById('runningCount').textContent = running;
      document.getElementById('maintCount').textContent = maint;
      document.getElementById('downCount').textContent = down;

      var html = '';
      machines.forEach(function(m) {
        var statusColor = m.status === 'running' ? '#34a853' :
                          m.status === 'maintenance' ? '#fbbc04' : '#ea4335';
        var statusIcon = m.status === 'running' ? 'bi-check-circle-fill' :
                         m.status === 'maintenance' ? 'bi-wrench' : 'bi-x-circle-fill';
        var statusText = m.status === 'running' ? 'ทำงาน' :
                         m.status === 'maintenance' ? 'ซ่อมบำรุง' : 'หยุดทำงาน';

        html += '<div class="col-6">' +
          '<div class="card p-3" style="border-left:4px solid ' + statusColor + ';cursor:pointer;" ' +
          'onclick="showMachineDetail(\'' + m.machineId + '\')">' +
          '<div class="d-flex justify-content-between align-items-start">' +
          '<div>' +
          '<h6 class="mb-1" style="font-weight:700;font-size:14px;">' + m.machineName + '</h6>' +
          '<small class="text-muted">' + m.machineId + '</small>' +
          '</div>' +
          '<i class="bi ' + statusIcon + '" style="color:' + statusColor + ';font-size:20px;"></i>' +
          '</div>' +
          '<div class="mt-2">' +
          '<span class="status-badge status-' + m.status + '">' + statusText + '</span>' +
          '</div>' +
          '<div class="mt-2" style="font-size:12px;color:#5f6368;">' +
          'สินค้า: ' + (m.assignedProducts ? m.assignedProducts.length : 0) + ' รายการ' +
          '</div>' +
          '</div></div>';
      });

      document.getElementById('machineStatusGrid').innerHTML = html;
    }

    function showMachineDetail(machineId) {
      showLoading();
      google.script.run
        .withSuccessHandler(function(data) {
          hideLoading();
          if (!data) {
            showToast('ไม่พบข้อมูลเครื่องจักร', 'error');
            return;
          }

          document.getElementById('modalMachineName').textContent = data.machineName + ' (' + data.machineId + ')';

          var statusColor = data.status === 'running' ? 'success' :
                            data.status === 'maintenance' ? 'warning' : 'danger';
          var statusText = data.status === 'running' ? 'ทำงาน' :
                           data.status === 'maintenance' ? 'ซ่อมบำรุง' : 'หยุดทำงาน';

          var html = '<div class="mb-3">' +
            '<span class="status-badge status-' + data.status + '">' + statusText + '</span>' +
            '</div>' +
            '<div class="row g-2 mb-3">' +
            '<div class="col-4 text-center"><div class="card p-2 kpi-card">' +
            '<div class="kpi-value" style="font-size:1.4rem;">' + (data.todayOutput || 0).toLocaleString() + '</div>' +
            '<div class="kpi-label">ยอดวันนี้</div></div></div>' +
            '<div class="col-4 text-center"><div class="card p-2 kpi-card">' +
            '<div class="kpi-value" style="font-size:1.4rem;">' + (data.todayEntries || 0) + '</div>' +
            '<div class="kpi-label">รายการ</div></div></div>' +
            '<div class="col-4 text-center"><div class="card p-2 kpi-card">' +
            '<div class="kpi-value text-danger" style="font-size:1.4rem;">' + (data.openTickets || 0) + '</div>' +
            '<div class="kpi-label">แจ้งซ่อม</div></div></div>' +
            '</div>' +
            '<h6 style="font-weight:600;">ผลิตภัณฑ์ที่กำหนด</h6>' +
            '<p style="font-size:13px;">' + (data.assignedProducts || 'ยังไม่กำหนด') + '</p>';

          document.getElementById('modalBody').innerHTML = html;
          new bootstrap.Modal(document.getElementById('machineModal')).show();
        })
        .withFailureHandler(function(err) {
          hideLoading();
          showToast('โหลดข้อมูลล้มเหลว', 'error');
        })
        .getMachineWithStats(machineId);
    }
  </script>
</body>
</html>
