<!DOCTYPE html>
<html lang="th">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ต้นทุน P&L</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"><link href="../css/style.css" rel="stylesheet"></head>
<body>
<div class="container"><div class="card">
<h3><i class="bi bi-cash-stack"></i> บริหารต้นทุน (โครงสร้าง P&L)</h3>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 12px;">
<select class="form-input" id="productSel" style="max-width:360px;" onchange="selectProduct()"></select>
<button class="btn btn-outline" onclick="loadCost()"><i class="bi bi-arrow-repeat"></i> โหลดใหม่</button>
<button class="btn btn-primary" onclick="saveCost()"><i class="bi bi-save"></i> บันทึก</button>
</div>
<table class="table" id="plTable"><thead><tr><th>รายการ</th><th>Actual</th><th>%</th></tr></thead><tbody></tbody></table>
</div></div>
<script src="../js/api.js"></script><script src="../js/auth.js"></script><script src="../js/ui.js"></script>
<script>
let products=[], current=0;
(async function(){ if(!Auth.requirePermission('cost')) return; UI.renderNav('cost'); UI.renderTopNav('บริหารต้นทุน','bi-cash-stack'); await loadCost(); })();
function n(v){const x=Number(v);return isNaN(x)?0:x;}
function loadSel(){ const sel=document.getElementById('productSel'); sel.innerHTML=products.map((p,i)=>`<option value="${i}">${p.productCode} - ${p.productName||''}</option>`).join(''); sel.value=String(current);}
function selectProduct(){ current=Number(document.getElementById('productSel').value||0); render(); }
async function loadCost(){ UI.showLoading('loading...'); try{ const r=await API.get('getCostPL'); if(!r.success) throw new Error(r.message||'โหลดไม่สำเร็จ'); products=r.items||[]; current=0; loadSel(); render(); }catch(e){UI.showToast(e.message,'error')} finally{UI.hideLoading();}}
function css(group){ if(group==='calc') return 'font-bold'; if(group==='revenue') return 'font-bold'; return ''; }
function render(){ const p=products[current]; const tb=document.querySelector('#plTable tbody'); if(!p){tb.innerHTML='';return;} tb.innerHTML=p.lines.map((ln,idx)=>`<tr><td class="${css(ln.group)}">${ln.label}</td><td>${ln.editable?`<input class='form-input' type='number' step='0.1' value='${n(ln.amount)}' onchange='editLine(${idx},this.value)'>`:n(ln.amount).toFixed(1)}</td><td class="font-bold">${n(ln.percent).toFixed(1)}%</td></tr>`).join('');}
function recalc(p){ const m={}; p.lines.forEach(l=>m[l.code]=n(l.amount)); const by=(c)=>n(m[c]); m.DLOT=by('DL')+by('OT')+by('DLSUP')+by('OTSUP'); m.OHVC=by('UTIL')+by('SUBCONTRACT')+by('ACCESS')+by('REPAIR')+by('OTHERVC'); m.COGS=by('RM')+by('SUBCON')+by('DLOT')+by('OHVC')+by('OHFC'); m.GP=by('SALE')-by('COGS'); m.SGA=by('SELLVC')+by('ADMINFC'); m.PROFIT=by('GP')-by('SGA'); m.EBIT=by('PROFIT')+by('OTHERINC')+by('EXBONAD')+by('EXBONOH')+by('MGTBON')+by('EXTRA'); m.EAT=by('EBIT')-by('INTEREST')-by('TAX'); p.lines.forEach(l=>{ if(m[l.code]!=null) l.amount=m[l.code]; const sale=by('SALE'); l.percent=sale? (n(l.amount)/sale)*100:0;}); }
function editLine(i,val){ const p=products[current]; p.lines[i].amount=n(val); recalc(p); render(); }
async function saveCost(){ UI.showLoading('saving...'); try{ const r=await API.post('saveCostPL',{rows:products}); if(!r.success) throw new Error(r.message||'บันทึกไม่สำเร็จ'); UI.showToast('บันทึกแล้ว '+r.updated+' รายการ','success'); }catch(e){UI.showToast(e.message,'error')} finally{UI.hideLoading();}}
</script>
</body></html>
