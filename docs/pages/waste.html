<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ใบนำส่งขยะ - H1 Lug&Screw</title>
  <link rel="icon" href="https://img.icons8.com/color/48/factory.png">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <style>
    .waste-category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }
    .category-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border: 2px solid var(--gray-light);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      background: var(--white);
    }
    .category-card input[type="radio"] {
      margin-top: 2px;
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .category-card:has(input:checked) {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .category-card .cat-label {
      font-size: 13px;
      line-height: 1.4;
      font-weight: 600;
    }
    .category-card .cat-sub {
      font-size: 11px;
      color: var(--gray);
      font-weight: 400;
    }
    .cat-hazardous:has(input:checked) { border-color: var(--danger); background: var(--danger-light); }
    .cat-recyclable:has(input:checked) { border-color: var(--success); background: var(--success-light); }
    .cat-industrial:has(input:checked) { border-color: var(--warning); background: var(--warning-light); }
    .cat-other:has(input:checked) { border-color: var(--primary); background: var(--primary-light); }

    .other-specify {
      display: none;
      margin-top: 6px;
    }
    .other-specify.show { display: block; }

    .scrap-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
    }
    .scrap-badge.hazardous  { background: var(--danger-light);  color: var(--danger); }
    .scrap-badge.recyclable { background: var(--success-light); color: var(--success); }
    .scrap-badge.industrial { background: var(--warning-light); color: #b45309; }
    .scrap-badge.other      { background: var(--primary-light); color: var(--primary); }

    @media (max-width: 480px) {
      .waste-category-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container mt-3">
    <!-- Header badge -->
    <div class="d-flex justify-between items-center mb-2">
      <span class="badge badge-info" id="dateBadge"></span>
    </div>

    <!-- ===== ประเภทของเสีย ===== -->
    <div class="card">
      <div class="card-title"><i class="bi bi-exclamation-diamond"></i> ประเภทของเสีย (Defective Type)</div>

      <div class="waste-category-grid">
        <label class="category-card cat-hazardous">
          <input type="radio" name="wasteCategory" value="hazardous">
          <div>
            <div class="cat-label"><i class="bi bi-radioactive" style="color:var(--danger);"></i> ขยะอันตราย</div>
            <div class="cat-sub">危险垃圾 Hazardous</div>
          </div>
        </label>

        <label class="category-card cat-recyclable">
          <input type="radio" name="wasteCategory" value="recyclable">
          <div>
            <div class="cat-label"><i class="bi bi-recycle" style="color:var(--success);"></i> ขยะรีไซเคิล</div>
            <div class="cat-sub">回收垃圾 Recyclable</div>
          </div>
        </label>

        <label class="category-card cat-industrial">
          <input type="radio" name="wasteCategory" value="industrial">
          <div>
            <div class="cat-label"><i class="bi bi-gear-wide" style="color:#b45309;"></i> ขยะอุตสาหกรรม</div>
            <div class="cat-sub">非危险工业垃圾 (เศษเหลือจากการผลิต)</div>
          </div>
        </label>

        <label class="category-card cat-other">
          <input type="radio" name="wasteCategory" value="other" onchange="toggleOtherInput()">
          <div style="flex:1;">
            <div class="cat-label"><i class="bi bi-three-dots" style="color:var(--primary);"></i> อื่นๆ (ระบุ)</div>
            <div class="cat-sub">其他 Other (Specify)</div>
            <div class="other-specify" id="otherSpecifyWrap">
              <input type="text" class="form-input" id="otherCategory"
                     placeholder="ระบุประเภท..." style="margin-top:4px;font-size:13px;"
                     onclick="event.stopPropagation()">
            </div>
          </div>
        </label>
      </div>
    </div>

    <!-- ===== รายละเอียดขยะ ===== -->
    <div class="card">
      <div class="card-title"><i class="bi bi-card-list"></i> รายการ / ชนิดขยะ (Description / Rubbish Type)</div>

      <div class="form-group">
        <label class="form-label">ชนิดขยะ</label>
        <div class="d-flex gap-2">
          <select class="form-input" id="wasteType" style="flex:1;">
            <option value="">-- เลือกชนิดขยะ --</option>
          </select>
          <button class="btn btn-outline" onclick="toggleManageTypes()" title="จัดการชนิดขยะ"
                  style="min-width:44px;padding:0 14px;flex-shrink:0;">
            <i class="bi bi-gear"></i>
          </button>
        </div>
      </div>

      <!-- จำนวน/น้ำหนัก -->
      <div class="form-group">
        <label class="form-label">จำนวน / น้ำหนัก (Quantity)</label>
        <div class="d-flex items-center gap-2">
          <input type="number" class="form-input" id="weightKg"
                 placeholder="เช่น 10.5" step="0.1" min="0.1" style="flex:1;"
                 inputmode="decimal">
          <span style="font-weight:600;white-space:nowrap;color:var(--gray);">กก.</span>
        </div>
      </div>
    </div>

    <!-- ===== ผู้นำส่งและผู้รับ ===== -->
    <div class="card">
      <div class="card-title"><i class="bi bi-people"></i> ผู้นำส่งและผู้รับ</div>

      <div class="row-2">
        <div class="form-group">
          <label class="form-label">ผู้นำส่ง (Transferred by)</label>
          <input type="text" class="form-input" id="transferredBy" readonly
                 style="background:#f0f2f5;color:var(--gray);cursor:default;">
        </div>
        <div class="form-group">
          <label class="form-label">ผู้รับ (Received by)</label>
          <input type="text" class="form-input" id="receivedBy" placeholder="ชื่อผู้รับ">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">แผนก/ฝ่าย (Division/Dept.)</label>
        <input type="text" class="form-input" id="department" placeholder="เช่น H1 Production">
      </div>
    </div>

    <!-- ===== วันที่และหมายเหตุ ===== -->
    <div class="card">
      <div class="card-title"><i class="bi bi-calendar-event"></i> วันที่และหมายเหตุ</div>

      <div class="form-group">
        <label class="form-label">วันที่และเวลา</label>
        <div class="d-flex gap-2">
          <input type="datetime-local" class="form-input" id="recordedAt" style="flex:1;">
          <button class="btn btn-outline" onclick="setCurrentDateTime()" title="รีเซ็ตเป็นเวลาปัจจุบัน"
                  style="min-width:44px;padding:0 14px;flex-shrink:0;">
            <i class="bi bi-clock-history"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">หมายเหตุ <span class="text-muted text-sm">(ไม่บังคับ)</span></label>
        <input type="text" class="form-input" id="wasteRemark" placeholder="ระบุหมายเหตุ (ถ้ามี)">
      </div>

      <button class="btn btn-success btn-full mt-2" id="wasteSubmitBtn" onclick="submitWaste()"
              style="height:52px;font-size:18px;">
        <i class="bi bi-check-circle"></i> บันทึก
      </button>
    </div>

    <!-- ===== จัดการชนิดขยะ (inline panel) ===== -->
    <div class="card hidden" id="manageTypesSection">
      <div class="card-title" style="display:flex;align-items:center;">
        <i class="bi bi-gear"></i>&nbsp;จัดการชนิดขยะ
        <button class="btn btn-outline btn-sm" onclick="toggleManageTypes()"
                style="margin-left:auto;padding:4px 14px;">
          <i class="bi bi-x"></i> ปิด
        </button>
      </div>
      <div class="d-flex gap-2 mb-3">
        <input type="text" class="form-input" id="newTypeName"
               placeholder="ชื่อชนิดขยะใหม่" style="flex:1;"
               onkeydown="if(event.key==='Enter')addWasteType()">
        <button class="btn btn-primary" onclick="addWasteType()" style="min-width:80px;">
          <i class="bi bi-plus-lg"></i> เพิ่ม
        </button>
      </div>
      <div id="wasteTypesList">
        <p class="text-center text-muted text-sm">กำลังโหลด...</p>
      </div>
    </div>

    <!-- ===== รายการวันนี้ ===== -->
    <div class="card">
      <div class="card-title">
        <i class="bi bi-clock-history"></i> รายการวันนี้
        <span class="badge badge-count" id="wasteCount">0</span>
      </div>
      <div id="todayWaste">
        <p class="text-center text-muted text-sm">ยังไม่มีรายการ</p>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    let wasteTypes = [];

    const CATEGORY_LABELS = {
      hazardous:  'ขยะอันตราย',
      recyclable: 'ขยะรีไซเคิล',
      industrial: 'ขยะอุตสาหกรรม',
      other:      'อื่นๆ'
    };

    (function init() {
      if (!Auth.requirePermission('waste')) return;
      UI.renderTopNav('ใบนำส่งขยะ', 'bi-trash3');
      UI.renderNav('waste');

      const user = Auth.getUser();
      document.getElementById('dateBadge').textContent = UI.formatDate(new Date());
      document.getElementById('transferredBy').value = user ? user.name : '';
      setCurrentDateTime();
      loadWasteTypes();
      loadTodayWaste();

      // Sync radio change for :has() fallback on older browsers
      document.querySelectorAll('input[name="wasteCategory"]').forEach(r => {
        r.addEventListener('change', syncCategoryCards);
      });
    })();

    function syncCategoryCards() {
      document.querySelectorAll('.category-card').forEach(card => {
        const radio = card.querySelector('input[type="radio"]');
        if (radio) card.classList.toggle('checked', radio.checked);
      });
      toggleOtherInput();
    }

    function toggleOtherInput() {
      const otherRadio = document.querySelector('input[value="other"]');
      const wrap = document.getElementById('otherSpecifyWrap');
      if (otherRadio && otherRadio.checked) {
        wrap.classList.add('show');
        document.getElementById('otherCategory').focus();
      } else {
        wrap.classList.remove('show');
      }
    }

    function setCurrentDateTime() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('recordedAt').value =
        now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) +
        'T' + pad(now.getHours()) + ':' + pad(now.getMinutes());
    }

    async function loadWasteTypes() {
      try {
        wasteTypes = await API.get('getWasteTypes');
        renderWasteTypeDropdown();
        renderWasteTypesList();
      } catch (err) {
        UI.showToast('โหลดชนิดขยะล้มเหลว', 'error');
      }
    }

    function renderWasteTypeDropdown() {
      const sel = document.getElementById('wasteType');
      const current = sel.value;
      let html = '<option value="">-- เลือกชนิดขยะ --</option>';
      wasteTypes.forEach(t => {
        html += '<option value="' + escAttr(t.typeName) + '"' +
          (t.typeName === current ? ' selected' : '') + '>' + escHtml(t.typeName) + '</option>';
      });
      sel.innerHTML = html;
    }

    function renderWasteTypesList() {
      const container = document.getElementById('wasteTypesList');
      if (!wasteTypes.length) {
        container.innerHTML = '<p class="text-center text-muted text-sm">ยังไม่มีชนิดขยะ</p>';
        return;
      }
      let html = '';
      wasteTypes.forEach(t => {
        html += '<div class="d-flex items-center justify-between mb-2" ' +
          'style="padding:8px 12px;background:#f8f9fa;border-radius:8px;">' +
          '<span>' + escHtml(t.typeName) + '</span>' +
          '<button class="btn btn-sm" ' +
          'style="background:var(--danger-light);color:var(--danger);padding:4px 12px;" ' +
          'onclick="confirmDeleteType(\'' + escJs(t.typeId) + '\',\'' + escJs(t.typeName) + '\')">' +
          '<i class="bi bi-trash"></i> ลบ</button></div>';
      });
      container.innerHTML = html;
    }

    function toggleManageTypes() {
      const section = document.getElementById('manageTypesSection');
      section.classList.toggle('hidden');
      if (!section.classList.contains('hidden')) {
        renderWasteTypesList();
        document.getElementById('newTypeName').focus();
      }
    }

    async function addWasteType() {
      const input = document.getElementById('newTypeName');
      const typeName = input.value.trim();
      if (!typeName) { UI.showToast('กรุณากรอกชื่อชนิดขยะ', 'warning'); return; }
      try {
        const result = await API.post('addWasteType', { typeName });
        if (result.success) {
          UI.showToast(result.message, 'success');
          input.value = '';
          await loadWasteTypes();
        } else {
          UI.showToast(result.message, 'error');
        }
      } catch (err) {
        UI.showToast('เพิ่มชนิดขยะล้มเหลว', 'error');
      }
    }

    async function confirmDeleteType(typeId, typeName) {
      if (!confirm('ยืนยันลบชนิดขยะ "' + typeName + '"?')) return;
      try {
        const result = await API.post('deleteWasteType', { typeId });
        if (result.success) {
          UI.showToast(result.message, 'success');
          await loadWasteTypes();
        } else {
          UI.showToast(result.message, 'error');
        }
      } catch (err) {
        UI.showToast('ลบชนิดขยะล้มเหลว', 'error');
      }
    }

    async function submitWaste() {
      const categoryRadio = document.querySelector('input[name="wasteCategory"]:checked');
      if (!categoryRadio) { UI.showToast('กรุณาเลือกประเภทของเสีย', 'warning'); return; }

      let wasteCategory = categoryRadio.value;
      if (wasteCategory === 'other') {
        const otherText = document.getElementById('otherCategory').value.trim();
        if (!otherText) { UI.showToast('กรุณาระบุประเภทขยะอื่นๆ', 'warning'); return; }
        wasteCategory = 'other:' + otherText;
      }

      const wasteType = document.getElementById('wasteType').value;
      const weightKg  = document.getElementById('weightKg').value.trim();
      const recordedAt = document.getElementById('recordedAt').value;
      const receivedBy = document.getElementById('receivedBy').value.trim();
      const department = document.getElementById('department').value.trim();
      const remark    = document.getElementById('wasteRemark').value.trim();

      if (!wasteType) { UI.showToast('กรุณาเลือกชนิดขยะ', 'warning'); return; }
      if (!weightKg || Number(weightKg) <= 0) { UI.showToast('กรุณากรอกน้ำหนักที่ถูกต้อง', 'warning'); return; }
      if (!recordedAt) { UI.showToast('กรุณาเลือกวันที่และเวลา', 'warning'); return; }

      const btn = document.getElementById('wasteSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:3px;display:inline-block;vertical-align:middle;margin-right:8px;"></div> กำลังบันทึก...';

      try {
        const result = await API.post('submitWaste', {
          data: { wasteCategory, wasteType, weightKg: Number(weightKg), recordedAt, receivedBy, department, remark }
        });
        if (result.success) {
          UI.showToast(result.message, 'success');
          resetForm();
          loadTodayWaste();
        } else {
          UI.showToast(result.message, 'error');
        }
      } catch (err) {
        UI.showToast('บันทึกล้มเหลว', 'error');
      }

      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-check-circle"></i> บันทึก';
    }

    function resetForm() {
      document.querySelectorAll('input[name="wasteCategory"]').forEach(r => { r.checked = false; });
      document.getElementById('otherCategory').value = '';
      document.getElementById('otherSpecifyWrap').classList.remove('show');
      document.getElementById('wasteType').value = '';
      document.getElementById('weightKg').value = '';
      document.getElementById('receivedBy').value = '';
      document.getElementById('wasteRemark').value = '';
      setCurrentDateTime();
    }

    async function loadTodayWaste() {
      try {
        const records = await API.get('getTodayWaste');
        document.getElementById('wasteCount').textContent = records.length;

        if (!records || records.length === 0) {
          document.getElementById('todayWaste').innerHTML =
            '<p class="text-center text-muted text-sm">ยังไม่มีรายการ</p>';
          return;
        }

        let totalWeight = 0;
        let html = '';
        records.forEach((r, idx) => {
          totalWeight += Number(r.WeightKg) || 0;
          const time = r.Timestamp ? (r.Timestamp.split(' ')[1] || '').substring(0, 5) : '';
          const catKey = (r.WasteCategory || '').startsWith('other:') ? 'other' : (r.WasteCategory || 'other');
          const catLabel = catKey === 'other'
            ? (r.WasteCategory || '').replace('other:', '') || 'อื่นๆ'
            : (CATEGORY_LABELS[catKey] || r.WasteCategory || '');

          html += '<div class="entry-card" style="border-left-color:' + catColor(catKey) + ';">' +
            '<div class="entry-header">' +
            '<div>' +
            '<strong>' + escHtml(r.WasteType || '') + '</strong>' +
            ' <span class="scrap-badge ' + catKey + '">' + escHtml(catLabel) + '</span>' +
            '</div>' +
            '<span class="text-muted text-sm">' + time + '</span>' +
            '</div>' +
            '<div class="entry-detail">' +
            '<span>' + escHtml(r.RecorderName || '') +
            (r.ReceivedBy ? ' → ' + escHtml(r.ReceivedBy) : '') + '</span>' +
            '<span><strong>' + Number(r.WeightKg || 0).toFixed(2) + '</strong> กก.</span>' +
            '</div>' +
            (r.Department ? '<div class="text-muted text-xs mt-1"><i class="bi bi-building"></i> ' + escHtml(r.Department) + '</div>' : '') +
            (r.Remark ? '<div class="text-muted text-xs mt-1">' + escHtml(r.Remark) + '</div>' : '') +
            '</div>';
        });

        const summary = '<div class="d-flex justify-between items-center mb-2" ' +
          'style="padding:10px 14px;background:var(--warning-light);border-radius:8px;">' +
          '<span style="font-weight:600;"><i class="bi bi-bar-chart-fill"></i> รวมน้ำหนักวันนี้</span>' +
          '<span style="font-weight:700;font-size:1.1em;">' + totalWeight.toFixed(2) + ' กก.</span>' +
          '</div>';

        document.getElementById('todayWaste').innerHTML = summary + html;
      } catch (err) {}
    }

    function catColor(key) {
      return { hazardous: 'var(--danger)', recyclable: 'var(--success)', industrial: 'var(--warning)', other: 'var(--primary)' }[key] || 'var(--gray)';
    }

    function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function escAttr(s) { return String(s||'').replace(/"/g,'&quot;'); }
    function escJs(s)   { return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
  </script>
</body>
</html>
