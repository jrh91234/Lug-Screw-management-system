<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>H1 Lug&Screw - Login</title>
  <link rel="icon" href="https://img.icons8.com/color/48/factory.png">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <!-- Logo -->
      <div class="login-logo">
        <i class="bi bi-gear-wide-connected"></i>
        <h4>H1 Lug&Screw</h4>
        <p>Production Management System</p>
      </div>

      <!-- API URL Config (show only if not set) -->
      <div id="apiConfig" class="form-group">
        <label class="form-label">Apps Script URL</label>
        <input type="url" class="form-input" id="apiUrlInput"
               placeholder="วาง URL ของ Apps Script Web App">
        <button class="btn btn-primary btn-full mt-2" onclick="saveApiUrl()" style="min-height:40px;font-size:14px;">
          <i class="bi bi-link-45deg"></i> บันทึก URL
        </button>
        <p style="font-size:11px;color:#5f6368;margin-top:8px;text-align:center;">
          ตั้งค่าครั้งเดียว - วาง URL ที่ได้จาก Deploy Apps Script
        </p>
      </div>

      <!-- Login Form -->
      <div id="loginForm" class="hidden">
        <div class="form-group">
          <label class="form-label">รหัสพนักงาน</label>
          <input type="text" class="form-input" id="employeeId" placeholder="กรอกรหัสพนักงาน"
                 autocomplete="off" style="text-transform:uppercase;">
        </div>

        <div class="form-group">
          <label class="form-label">รหัส PIN</label>
          <input type="password" class="form-input pin-display" id="pinInput" maxlength="4"
                 readonly placeholder="- - - -">
        </div>

        <div id="errorMsg" class="hidden" style="background:#fce8e6;color:#c5221f;padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:12px;"></div>

        <div class="numpad">
          <button class="numpad-btn" onclick="addPin('1')">1</button>
          <button class="numpad-btn" onclick="addPin('2')">2</button>
          <button class="numpad-btn" onclick="addPin('3')">3</button>
          <button class="numpad-btn" onclick="addPin('4')">4</button>
          <button class="numpad-btn" onclick="addPin('5')">5</button>
          <button class="numpad-btn" onclick="addPin('6')">6</button>
          <button class="numpad-btn" onclick="addPin('7')">7</button>
          <button class="numpad-btn" onclick="addPin('8')">8</button>
          <button class="numpad-btn" onclick="addPin('9')">9</button>
          <button class="numpad-btn" onclick="clearPin()" style="font-size:16px;"><i class="bi bi-x-lg"></i></button>
          <button class="numpad-btn" onclick="addPin('0')">0</button>
          <button class="numpad-btn" onclick="deletePin()" style="font-size:16px;"><i class="bi bi-backspace"></i></button>
        </div>

        <button class="btn btn-primary btn-full mt-3" onclick="doLogin()" id="loginBtn"
                style="height:54px;font-size:18px;font-weight:700;">
          <i class="bi bi-box-arrow-in-right"></i> เข้าสู่ระบบ
        </button>

        <button onclick="changeApiUrl()" style="display:block;margin:12px auto 0;background:none;border:none;color:#5f6368;font-size:12px;cursor:pointer;font-family:inherit;">
          <i class="bi bi-gear"></i> เปลี่ยน API URL
        </button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    let pinValue = '';

    // Check if API URL is configured
    (function init() {
      if (API.getBaseUrl()) {
        document.getElementById('apiConfig').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');

        // Auto-redirect if already logged in
        if (Auth.isLoggedIn()) {
          window.location.href = 'pages/production.html';
        }
      } else {
        document.getElementById('apiConfig').classList.remove('hidden');
        document.getElementById('loginForm').classList.add('hidden');
      }
    })();

    function saveApiUrl() {
      const url = document.getElementById('apiUrlInput').value.trim();
      if (!url) {
        UI.showToast('กรุณาวาง URL', 'warning');
        return;
      }
      API.setBaseUrl(url);
      document.getElementById('apiConfig').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
      UI.showToast('บันทึก URL เรียบร้อย', 'success');
    }

    function changeApiUrl() {
      document.getElementById('apiUrlInput').value = API.getBaseUrl();
      document.getElementById('apiConfig').classList.remove('hidden');
      document.getElementById('loginForm').classList.add('hidden');
    }

    function addPin(digit) {
      if (pinValue.length < 4) {
        pinValue += digit;
        document.getElementById('pinInput').value = pinValue;
        hideError();
      }
    }

    function deletePin() {
      pinValue = pinValue.slice(0, -1);
      document.getElementById('pinInput').value = pinValue;
    }

    function clearPin() {
      pinValue = '';
      document.getElementById('pinInput').value = '';
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('errorMsg').classList.add('hidden');
    }

    async function doLogin() {
      const employeeId = document.getElementById('employeeId').value.trim().toUpperCase();
      const pin = pinValue;

      if (!employeeId) { showError('กรุณากรอกรหัสพนักงาน'); return; }
      if (pin.length !== 4) { showError('กรุณากรอกรหัส PIN 4 หลัก'); return; }

      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:3px;"></div> กำลังเข้าสู่ระบบ...';

      try {
        const result = await API.post('login', { employeeId, pin });
        if (result.success) {
          Auth.setToken(result.token);
          Auth.setUser(result.user);
          window.location.href = 'pages/production.html';
        } else {
          showError(result.message);
        }
      } catch (err) {
        showError('เชื่อมต่อ server ไม่ได้ - ตรวจสอบ API URL');
      }

      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> เข้าสู่ระบบ';
    }
  </script>
</body>
</html>
