name: Deploy to Apps Script

# Auto-deploys the Apps Script code to Google every time changes land on the
# default branch (which is what every merge produces). Manual runs are also
# allowed from the Actions tab.
#
# One-time setup required (repo → Settings → Secrets and variables → Actions):
#   CLASPRC_JSON  – the full contents of your ~/.clasprc.json after running
#                   `clasp login` once on your own computer (the Google auth).
#   SCRIPT_ID     – the real Apps Script project ID (from the script URL or
#                   Project Settings → IDs). Replaces the placeholder in .clasp.json.
#   DEPLOYMENT_ID – (optional) the web app deployment ID to update so the /exec
#                   URL stays the same. If omitted, code is pushed to HEAD only.
# See DEPLOYMENT.md for step-by-step instructions.

on:
  push:
    branches:
      - main
      - claude/**
  workflow_dispatch:

concurrency:
  group: appsscript-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        # Pinned to the 3.x line: that is the layout the stored CLASPRC_JSON secret is
        # in, and clasp majors change it (2.4.2 fails with "Error retrieving access
        # token" against a 3.x credential). Pinning the major keeps a future 4.0 from
        # breaking the deploy the day npm's latest moves on, without touching auth.
        run: npm install -g @google/clasp@3

      - name: Verify required secrets are set
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          missing=0
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Secret CLASPRC_JSON is not set."; missing=1; fi
          if [ -z "$SCRIPT_ID" ]; then echo "::error::Secret SCRIPT_ID is not set."; missing=1; fi
          if [ "$missing" = "1" ]; then
            echo "::error::Add the missing secrets under Settings → Secrets and variables → Actions, then re-run. See DEPLOYMENT.md."
            exit 1
          fi

      - name: Write Google credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s\n' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Write .clasp.json and stage manifest
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          printf '{"scriptId":"%s","rootDir":"src"}\n' "$SCRIPT_ID" > .clasp.json
          # clasp expects the manifest inside rootDir (src/); the repo keeps it at root.
          cp appsscript.json src/appsscript.json

      # The web app must stay reachable by anyone holding the link: the operators open
      # it on shop-floor devices that are not signed into a Google account, and the
      # front-end calls /exec with credentials omitted. Any other access value turns
      # every request into a Google sign-in redirect, which the browser then reports as
      # a CORS failure — the app looks broken rather than locked. Catch that here
      # instead of after it reaches production.
      - name: Verify web app stays public
        run: |
          access=$(node -e "process.stdout.write(String((require('./appsscript.json').webapp||{}).access||''))")
          execute_as=$(node -e "process.stdout.write(String((require('./appsscript.json').webapp||{}).executeAs||''))")
          echo "webapp.access=$access executeAs=$execute_as"
          if [ "$access" != "ANYONE_ANONYMOUS" ]; then
            echo "::error::appsscript.json webapp.access is '$access' but must be ANYONE_ANONYMOUS (\"Anyone\" / ทุกคนที่มีลิงก์). Deploying this would lock every user out of the web app."
            exit 1
          fi
          if [ "$execute_as" != "USER_DEPLOYING" ]; then
            echo "::error::appsscript.json webapp.executeAs is '$execute_as' but must be USER_DEPLOYING, or anonymous visitors have no rights to the spreadsheet."
            exit 1
          fi

      - name: Push code to Apps Script
        run: clasp push --force

      - name: Update web app deployment (keeps the same /exec URL)
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -n "$DEPLOYMENT_ID" ]; then
            clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "auto-deploy ${GITHUB_SHA::7}"
            echo "Deployed new version to deployment $DEPLOYMENT_ID"
          else
            echo "No DEPLOYMENT_ID secret set — code pushed to HEAD only."
            echo "If your live /exec URL is pinned to a version, add a DEPLOYMENT_ID secret so it updates automatically."
          fi
